<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rezepte">
<meta name="theme-color" content="#F6F6F5" id="themeColor">
<title>Rezeptesammlung</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<style>
@font-face{ font-family:"Archivo Black"; src:url(fonts/ArchivoBlack-Regular.woff2) format("woff2"); font-weight:400; font-display:swap; }
@font-face{ font-family:"Archivo"; src:url(fonts/Archivo-var.woff2) format("woff2"); font-weight:400 700; font-display:swap; }
@font-face{ font-family:"Space Mono"; src:url(fonts/SpaceMono-Regular.woff2) format("woff2"); font-weight:400; font-display:swap; }
@font-face{ font-family:"Space Mono"; src:url(fonts/SpaceMono-Bold.woff2) format("woff2"); font-weight:700; font-display:swap; }
@font-face{ font-family:"Geist"; src:url(fonts/Geist.woff2) format("woff2"); font-weight:400 700; font-display:swap; }
@font-face{ font-family:"Inter"; src:url(fonts/Inter.woff2) format("woff2"); font-weight:400 700; font-display:swap; }
@font-face{ font-family:"Fraunces"; src:url(fonts/Fraunces.woff2) format("woff2"); font-weight:600; font-display:swap; }
@font-face{ font-family:"DM Serif Display"; src:url(fonts/DMSerif.woff2) format("woff2"); font-weight:400; font-display:swap; }
@font-face{ font-family:"DM Sans"; src:url(fonts/DMSans.woff2) format("woff2"); font-weight:400 700; font-display:swap; }
@font-face{ font-family:"Space Grotesk"; src:url(fonts/SpaceGrotesk.woff2) format("woff2"); font-weight:400 700; font-display:swap; }
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --danger:#C1121C; --on-rot:#fff; --fab-shadow:none; --bar-bd:1px solid var(--line); --field-bd:1px solid transparent;
  --gl-fill:currentColor; --gl-stroke:none; --gl-sw:0; --disp-w:700; --disp-ls:-.03em;
}
/* Graphit mit Bauhausrot (Standard) */
:root, :root[data-style="graphit"]{
  --paper:#F6F6F5; --paper2:#E6E6E3; --card:#FFFFFF; --ink:#262624; --ink2:#6E6E69; --line:#DDDDD9;
  --rot:#D52B1E; --blau:#262624; --gelb:#F5D9D6; --on-gelb:#5A1510; --tint:#E6E6E3; --tint-ink:#262624; --field:#ECECE9;
  --g-rot:#3A3A37; --g-blau:#3A3A37; --g-gelb:#3A3A37; --g-ink:#3A3A37;
  --r:10px; --rt:10px; --danger:#D52B1E;
  --f-disp:"Geist","Helvetica Neue",Arial,sans-serif; --f-body:"Geist","Helvetica Neue",Arial,sans-serif; --f-mono:"Geist","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
:root[data-style="abend"]{
  --paper:#1E2328; --paper2:#2B3138; --card:#252B31; --ink:#ECE6DA; --ink2:#9AA1A9; --line:#343B43;
  --rot:#F2B84B; --on-rot:#1E2328; --blau:#F2B84B; --gelb:#4A3E22; --on-gelb:#F8DFA8; --tint:#3A3326; --tint-ink:#F2B84B; --field:#2B3138;
  --g-rot:#F2B84B; --g-blau:#F2B84B; --g-gelb:#F2B84B; --g-ink:#F2B84B; --gl-fill:none; --gl-stroke:currentColor; --gl-sw:9;
  --r:10px; --rt:10px; --danger:#FF7A6E;
  --f-disp:"Inter","Helvetica Neue",Arial,sans-serif; --f-body:"Inter","Helvetica Neue",Arial,sans-serif; --f-mono:"Inter","Helvetica Neue",Arial,sans-serif; --disp-w:600;
  color-scheme:dark;
}
:root[data-style="bauhaus"]{
  --paper:#F5F3EE; --paper2:#EBE8E0; --card:#FFFFFF; --ink:#1D1B18; --ink2:#615B51; --line:#D6D1C4;
  --rot:#CC3A2B; --blau:#24479C; --gelb:#EFB728; --on-gelb:#1D1B18; --tint:#EBE8E0; --tint-ink:#1D1B18; --field:#FFFFFF; --field-bd:2px solid #1D1B18;
  --g-rot:#CC3A2B; --g-blau:#24479C; --g-gelb:#EFB728; --g-ink:#1D1B18;
  --r:0px; --rt:0px; --fab-shadow:4px 4px 0 #1D1B18; --bar-bd:2px solid #1D1B18;
  --f-disp:"Archivo Black","Arial Black",Arial,sans-serif; --f-body:"Archivo","Helvetica Neue",Arial,sans-serif; --f-mono:"Space Mono",ui-monospace,Menlo,monospace; --disp-w:400; --disp-ls:-.02em;
  color-scheme:light;
}
:root[data-style="nordisch"]{
  --paper:#F6F5F1; --paper2:#E1E9E3; --card:#FFFFFF; --ink:#23302B; --ink2:#6F7C74; --line:#DCE2DC;
  --rot:#4F7A60; --blau:#4F7A60; --gelb:#DCE9DF; --on-gelb:#23302B; --tint:#E1E9E3; --tint-ink:#3F5E48; --field:#EAEEE9;
  --g-rot:#4F7A60; --g-blau:#4F7A60; --g-gelb:#4F7A60; --g-ink:#4F7A60; --gl-fill:none; --gl-stroke:currentColor; --gl-sw:9;
  --r:8px; --rt:10px; --danger:#B3261E;
  --f-disp:"Fraunces",Georgia,serif; --f-body:"Inter","Helvetica Neue",Arial,sans-serif; --f-mono:"Inter","Helvetica Neue",Arial,sans-serif; --disp-w:600; --disp-ls:-.01em;
  color-scheme:light;
}
:root[data-style="altrosa"]{
  --paper:#F3E6E3; --paper2:#FBF4F2; --card:#FFFBFA; --ink:#3A2F30; --ink2:#7E6E6E; --line:#E6D3CF;
  --rot:#6F8496; --blau:#6F8496; --gelb:#E9CFCB; --on-gelb:#3A2F30; --tint:#DCE3EA; --tint-ink:#3D4E5E; --field:#FBF4F2;
  --g-rot:#C98A84; --g-blau:#8FA3B5; --g-gelb:#D9B8A0; --g-ink:#7E6E6E;
  --r:14px; --rt:14px; --danger:#A33A3A;
  --f-disp:"DM Serif Display",Georgia,serif; --f-body:"DM Sans","Helvetica Neue",Arial,sans-serif; --f-mono:"DM Sans","Helvetica Neue",Arial,sans-serif; --disp-w:400; --disp-ls:-.01em;
  color-scheme:light;
}
:root[data-style="kontrast"]{
  --paper:#FFFFFF; --paper2:#F0F0F0; --card:#FFFFFF; --ink:#111111; --ink2:#6B6B6B; --line:#E2E2E2;
  --rot:#0047FF; --blau:#0047FF; --gelb:#DCE6FF; --on-gelb:#0033CC; --tint:#E5ECFF; --tint-ink:#0033CC; --field:#F0F0F0;
  --g-rot:#111; --g-blau:#111; --g-gelb:#111; --g-ink:#111;
  --r:0px; --rt:0px; --danger:#D50000;
  --f-disp:"Space Grotesk","Helvetica Neue",Arial,sans-serif; --f-body:"Space Grotesk","Helvetica Neue",Arial,sans-serif; --f-mono:"Space Grotesk","Helvetica Neue",Arial,sans-serif; --disp-w:700; --disp-ls:-.03em;
  color-scheme:light;
}
.gl *{ fill:var(--gl-fill); stroke:var(--gl-stroke); stroke-width:var(--gl-sw); }
.ic{ fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
.tile{ display:flex; align-items:center; justify-content:center; background:var(--paper2); border-radius:var(--rt); }
.cov .tile svg, .tile svg{ width:46% !important; height:46% !important; object-fit:contain; }
.hero.nophoto .tile svg{ width:auto !important; height:56% !important; }
.looks{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
.look{ position:relative; text-align:left; border:1.5px solid rgba(0,0,0,.12); border-radius:12px; padding:12px 12px 10px; min-height:84px; display:flex; flex-direction:column; justify-content:space-between; }
.look.on{ outline:3px solid var(--rot); outline-offset:2px; }
.look .dot{ position:absolute; right:12px; top:14px; width:14px; height:14px; border-radius:50%; }
.look small{ font:500 12.5px/1.2 var(--f-body); opacity:.8; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 var(--f-body); -webkit-font-smoothing:antialiased; }
button,input,textarea,select{ font:inherit; color:inherit; }
button{ cursor:pointer; -webkit-tap-highlight-color:transparent; }
:focus-visible{ outline:3px solid var(--blau); outline-offset:2px; }
img{ max-width:100%; display:block; }
.wrap{ max-width:1120px; margin:0 auto; padding:0 18px; }
.mono{ font-family:var(--f-mono); }
.muted{ color:var(--ink2); }
.hidden{ display:none !important; }

/* Kopfzeile */
.bar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--paper); border-bottom:var(--bar-bd); }
.bar .wrap{ display:flex; align-items:center; gap:8px; min-height:54px; }
.bar .grow{ flex:1; min-width:0; }
.iconbtn{ border:0; background:none; min-width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:0 8px; font-weight:600; border-radius:0; }
.iconbtn svg{ width:22px; height:22px; }
.backbtn{ font-weight:600; padding-left:0; }

/* Liste */
.masthead{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; padding:22px 0 14px; }
.masthead h1{ font:var(--disp-w) clamp(40px,11vw,76px)/.9 var(--f-disp); letter-spacing:var(--disp-ls); margin:0; }
.masthead .count{ font-family:var(--f-mono); font-size:13px; color:var(--ink2); padding-bottom:6px; white-space:nowrap; }
.masthead{ padding-bottom:4px !important; }
.quiet{ display:flex; align-items:center; gap:4px 18px; flex-wrap:wrap; margin:0 0 12px; }
.quiet button{ border:0; background:none; padding:8px 0; display:inline-flex; align-items:center; gap:6px; font-size:14.5px; font-weight:600; color:var(--ink); }
.quiet button svg{ width:17px; height:17px; color:var(--rot); }
.quiet button:hover{ text-decoration:underline; text-underline-offset:4px; }
.quiet .count{ margin-left:auto; padding:0; font:13px var(--f-mono); color:var(--ink2); }
.search{ position:relative; }
.search input{ width:100%; height:48px; border:var(--field-bd); background:var(--field); padding:0 14px 0 42px; font-size:17px; border-radius:var(--r); -webkit-appearance:none; }
.search input::placeholder{ color:var(--ink2); }
.search svg{ position:absolute; left:13px; top:13px; width:22px; height:22px; color:var(--ink2); }
.filters{ margin:12px -18px 0; }
.frow{ display:flex; gap:8px; overflow-x:auto; padding:4px 18px 6px; scrollbar-width:none; }
.frow::-webkit-scrollbar{ display:none; }
.chip{ flex:none; display:inline-flex; align-items:center; gap:7px; height:36px; padding:0 13px; border:1.5px solid var(--line); background:var(--card); font-size:14.5px; font-weight:500; white-space:nowrap; border-radius:18px; }
.chip.on{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.chip.on svg{ color:var(--paper) !important; }
.chip .g{ width:14px; height:14px; flex:none; }
.chip.tag::before{ content:"#"; font-family:var(--f-mono); opacity:.55; margin-right:-3px; }
.seg{ display:inline-flex; border:1.5px solid var(--ink); flex:none; border-radius:var(--r); overflow:hidden; }
.seg button{ border:0; background:var(--card); height:34px; padding:0 11px; font-size:14px; font-weight:600; white-space:nowrap; }
.seg button+button{ border-left:1.5px solid var(--ink); }
.seg button.on{ background:var(--ink); color:var(--paper); }
.rowlabel{ flex:none; align-self:center; font-size:13px; color:var(--ink2); padding-right:2px; }
.sortline{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0 4px; font-size:14px; color:var(--ink2); }
.sortline select{ border:0; background:none; font-weight:600; color:var(--ink); padding:6px 0; }

.results{ list-style:none; margin:6px 0 120px; padding:0; }
.rcard{ display:grid; grid-template-columns:84px 1fr; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer; }
.rcard .cov{ width:84px; height:84px; overflow:hidden; background:var(--paper2); border-radius:var(--rt); }
.rcard .cov img,.rcard .cov svg{ width:100%; height:100%; object-fit:cover; display:block; }
.rcard h3{ font:var(--disp-w) 18px/1.15 var(--f-disp); letter-spacing:var(--disp-ls); margin:0 0 5px; hyphens:auto; -webkit-hyphens:auto; }
.rcard .meta{ font-size:13.5px; color:var(--ink2); display:flex; flex-wrap:wrap; gap:4px 12px; }
.rcard .meta .mono{ font-size:12.5px; color:var(--ink); }
.rcard .fav{ color:var(--rot); }
.rcard .who{ color:var(--blau); font-weight:600; }
.byline{ margin:-4px 0 12px; font-weight:600; color:var(--blau); }
@media (min-width:760px){
  .results{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:26px 22px; margin-top:14px; }
  .rcard{ display:block; padding:0; border:0; }
  .rcard .cov{ width:100%; height:auto; aspect-ratio:4/3; margin-bottom:10px; }
  .rcard h3{ font-size:20px; }
}
.empty{ padding:40px 0 140px; max-width:520px; }
.empty h2{ font:var(--disp-w) 28px/1.05 var(--f-disp); margin:0 0 10px; }
.empty p{ margin:0 0 18px; color:var(--ink2); }

.fab{ position:fixed; right:max(18px, env(safe-area-inset-right,0px)); bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:30; height:58px; padding:0 22px 0 18px; border:0; background:var(--rot); color:var(--on-rot); font:var(--disp-w) 17px/1 var(--f-disp); display:flex; align-items:center; gap:8px; box-shadow:var(--fab-shadow); border-radius:var(--r); }
.fab svg{ width:24px; height:24px; }
.fab:active{ transform:translate(1px,1px); }

/* Buttons */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:46px; padding:0 18px; border:0; background:var(--tint); color:var(--tint-ink); font-weight:700; font-size:15.5px; border-radius:var(--r); }
.btn.primary{ background:var(--rot); color:var(--on-rot); }
.btn.red{ background:var(--danger); color:#fff; }
.btn.ghost{ background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line); }
.btn.danger{ color:var(--danger); background:transparent; box-shadow:inset 0 0 0 1.5px var(--danger); }
.btn svg{ width:19px; height:19px; }

/* Detail */
.hero{ position:relative; margin:0 -18px; }
.hero .cov{ width:100%; aspect-ratio:16/10; max-height:62vh; overflow:hidden; background:var(--paper2); border-radius:var(--rt); }
.hero .cov img,.hero .cov svg{ width:100%; height:100%; object-fit:cover; display:block; }
.hero.nophoto .cov{ aspect-ratio:auto; height:132px; }
@media (min-width:760px){ .hero.nophoto .cov{ height:180px; } }
@media (min-width:760px){ .hero{ margin:22px 0 0; } .hero:not(.nophoto) .cov{ aspect-ratio:21/9; } }
.dtitle{ font:var(--disp-w) clamp(32px,8.6vw,62px)/1 var(--f-disp); letter-spacing:var(--disp-ls); margin:20px 0 12px; hyphens:auto; -webkit-hyphens:auto; }
.marks{ display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; font-size:14.5px; }
.marks .course{ display:inline-flex; align-items:center; gap:6px; font-weight:600; }
.marks .course svg{ width:16px; height:16px; }
.marks .tagtxt{ font-family:var(--f-mono); font-size:13px; color:var(--ink2); }
.facts{ display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); border-top:2px solid var(--ink); border-left:1px solid var(--line); margin:20px 0 6px; }
.facts div{ padding:10px 12px 11px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
.facts dt{ font-size:12.5px; color:var(--ink2); margin:0 0 2px; }
.facts dd{ margin:0; font:700 15px/1.25 var(--f-mono); }
.facts dd small{ font-weight:400; font-size:11.5px; color:var(--ink2); display:block; }
.diff{ display:inline-flex; gap:3px; vertical-align:-1px; margin-right:6px; }
.diff i{ width:9px; height:9px; background:var(--line); display:block; }
.diff i.on{ background:var(--ink); }
details.intro{ margin:16px 0 4px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
details.intro summary{ list-style:none; cursor:pointer; padding:12px 0; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
details.intro summary::-webkit-details-marker{ display:none; }
details.intro summary::after{ content:"+"; font:400 24px/1 var(--f-disp); }
details.intro[open] summary::after{ content:"–"; }
details.intro .txt{ padding:0 0 14px; max-width:68ch; color:var(--ink2); white-space:pre-wrap; }
.ctl{ display:grid; gap:10px; padding:16px 0 6px; max-width:520px; }
.ctlrow{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.ctl .stepper{ height:42px; }
.ctl .stepper button{ width:42px; }
.ctl .stepper .val{ min-width:104px; font-size:14px; }
.seg.small button{ height:30px; font-size:13px; padding:0 9px; }
.diffb{ display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:600; color:var(--ink2); }
.ctl .wake{ font-size:13px; }
.part + .part{ margin-top:26px; padding-top:6px; border-top:2px solid var(--ink); }
.part .parthead + .cols .sechead{ font-size:20px; }
.grphead{ font:700 15px/1.2 var(--f-body); margin:16px 0 4px; padding-bottom:6px; border-bottom:2px solid var(--ink); }
.gcard + .gcard{ border-top:2px solid var(--line); margin-top:10px; padding-top:16px; }
.hint{ display:block; font-style:normal; font-size:13px; color:var(--ink2); margin:8px 0 14px; }
.parthead{ font:var(--disp-w) 26px/1.05 var(--f-disp); letter-spacing:var(--disp-ls); margin:18px 0 0; }
.partcard{ padding:4px 0 10px; }
.partcard + .partcard{ border-top:2px solid var(--line); margin-top:10px; padding-top:16px; }
.parttop{ display:flex; gap:10px; align-items:flex-end; margin-bottom:12px; }
.scans{ display:flex; gap:10px; flex-wrap:wrap; }
.scan{ border:0; padding:0; background:none; width:84px; height:84px; border-radius:var(--rt); overflow:hidden; }
.scan img{ width:100%; height:100%; object-fit:cover; }
.viewer{ position:fixed; inset:0; z-index:80; background:#0d0d0d; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
.vscroll{ flex:1; overflow:auto; -webkit-overflow-scrolling:touch; touch-action:pan-x pan-y pinch-zoom; }
.vscroll img{ display:block; max-width:none; margin:0 auto; }
.vbar{ display:flex; gap:8px; justify-content:center; padding:10px; flex-wrap:wrap; }
.stepper{ display:inline-flex; align-items:stretch; border:2px solid var(--ink); background:var(--card); height:46px; border-radius:var(--r); overflow:hidden; }
.stepper button{ width:46px; border:0; background:none; font:700 22px/1 var(--f-body); }
.stepper .val{ display:flex; align-items:center; padding:0 10px; font:700 15px var(--f-mono); border-left:2px solid var(--ink); border-right:2px solid var(--ink); min-width:116px; justify-content:center; white-space:nowrap; }
.stepper .val.scaled{ background:var(--gelb); color:var(--on-gelb); }
.cols{ display:block; }
@media (min-width:860px){ .cols{ display:grid; grid-template-columns:minmax(280px,360px) 1fr; gap:44px; align-items:start; } .cols .ingbox{ position:sticky; top:calc(env(safe-area-inset-top,0px) + 70px); max-height:calc(100vh - 90px); overflow:auto; } }
.sechead{ font:var(--disp-w) 24px/1 var(--f-disp); letter-spacing:var(--disp-ls); margin:22px 0 10px; display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.sechead small{ font:400 12.5px var(--f-body); color:var(--ink2); }
.inglist{ list-style:none; margin:0; padding:0; }
.inglist .grp{ font-weight:700; padding:14px 0 6px; border-bottom:2px solid var(--ink); }
.ing{ display:grid; grid-template-columns:minmax(78px,auto) 1fr; gap:12px; align-items:baseline; padding:9px 0; border-bottom:1px solid var(--line); cursor:pointer; }
.ing .qty{ justify-self:start; font:700 14.5px/1.3 var(--f-mono); border:0; background:none; padding:2px 0; text-align:left; white-space:nowrap; }
.ing .qty.conv{ text-decoration:underline dotted var(--ink2); text-underline-offset:4px; }
.ing .qty.scaled{ background:linear-gradient(transparent 55%, color-mix(in srgb, var(--gelb) 60%, transparent) 55%); }
.ing .qty .approx{ font-weight:400; color:var(--ink2); }
.ing .nm{ line-height:1.35; }
.ing.done .nm,.ing.done .qty{ text-decoration:line-through; opacity:.4; }
.steps{ list-style:none; margin:0; padding:0; counter-reset:s; }
.steps .grp{ font-weight:700; padding:16px 0 4px; }
.step{ display:grid; grid-template-columns:44px 1fr; gap:10px; padding:14px 0; border-bottom:1px solid var(--line); cursor:pointer; max-width:72ch; }
.step::before{ counter-increment:s; content:counter(s); font:var(--disp-w) 26px/1 var(--f-disp); color:var(--blau); }
.step p{ margin:0; font-size:17px; line-height:1.55; }
.step.done{ opacity:.38; }
.step.done::before{ content:"✓"; color:var(--ink2); }
.notes{ margin:26px 0 0; padding:14px 16px; background:var(--card); border-left:6px solid var(--gelb); max-width:72ch; white-space:pre-wrap; }
.sourcebox{ margin:26px 0 0; font-size:14.5px; color:var(--ink2); }

.actions{ display:flex; flex-wrap:wrap; gap:10px; margin:30px 0 120px; padding-top:18px; border-top:2px solid var(--ink); }
.wake{ display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:600; border:0; background:none; padding:6px 0; }
.wake .sw{ width:38px; height:22px; border:2px solid var(--ink); position:relative; }
.wake .sw::after{ content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; background:var(--ink); transition:left .15s; }
.wake.on .sw{ background:var(--gelb); } .wake.on .sw::after{ left:18px; }

/* Editor */
.form{ padding:6px 0 140px; max-width:760px; }
.fset{ padding:20px 0 6px; border-bottom:1px solid var(--line); }
.fset > h2{ font:var(--disp-w) 21px/1.1 var(--f-disp); letter-spacing:var(--disp-ls); margin:0 0 12px; }
.fld{ display:block; margin:0 0 14px; }
.fld > span{ display:block; font-size:13.5px; font-weight:600; margin:0 0 5px; }
.fld > em{ display:block; font-style:normal; font-size:13px; color:var(--ink2); margin:5px 0 0; }
.in, .ta{ width:100%; border:1px solid var(--line); background:var(--field); padding:10px 12px; font-size:16px; border-radius:var(--r); -webkit-appearance:none; }
.in{ height:46px; }
.ta{ min-height:120px; resize:vertical; line-height:1.45; }
.ta.tall{ min-height:220px; }
.ta.mono{ font:15px/1.55 var(--f-mono); }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
@media (max-width:420px){ .grid3{ grid-template-columns:1fr 1fr; } }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.addtag{ display:flex; gap:8px; margin-top:10px; }
.addtag .in{ flex:1; }
.photo{ display:flex; gap:14px; align-items:center; }
.photo .cov{ width:96px; height:96px; background:var(--paper2); overflow:hidden; flex:none; }
.photo .cov img,.photo .cov svg{ width:100%; height:100%; object-fit:cover; }
.importbox{ background:var(--gelb); color:var(--on-gelb); padding:16px; margin:16px -18px 0; }
@media (min-width:760px){ .importbox{ margin:16px 0 0; } }
.importbox h2{ font:var(--disp-w) 21px/1.1 var(--f-disp); margin:0 0 6px; }
.importbox p{ margin:0 0 10px; font-size:14.5px; }
.importbox .ta{ background:var(--card); color:var(--ink); }

.importbox .btn{ background:var(--card); color:var(--ink); }
.importbox .btn.primary{ background:var(--ink); color:var(--paper); }
.ocrbar{ height:6px; background:var(--line); margin-top:8px; }
.ocrbar i{ display:block; height:100%; background:var(--ink); width:0; transition:width .2s; }
.ocrbar i.busy{ background:repeating-linear-gradient(90deg,var(--ink) 0 20px,transparent 20px 40px); background-size:40px 100%; animation:busy .8s linear infinite; }
@keyframes busy{ to{ background-position:40px 0; } }
.fld > .seg{ display:inline-flex; }
.importbox .linkish{ border:0; background:none; text-decoration:underline; padding:0 4px; font-size:14.5px; color:inherit; }
.preview{ margin:8px 0 0; font-size:14px; }
.preview li{ list-style:none; padding:3px 0; border-bottom:1px dashed var(--line); display:flex; gap:10px; }
.preview ul{ padding:0; margin:0; }
.preview .q{ font:700 13px var(--f-mono); min-width:76px; }
.preview .q.none{ color:var(--ink2); font-weight:400; }
.preview li.warn{ background:color-mix(in srgb, var(--danger) 18%, transparent); }
.preview .h{ font-weight:700; padding-top:8px; }
.err{ color:var(--rot); font-weight:600; font-size:14px; }

/* Sheets & Toast */
.scrim{ position:fixed; inset:0; background:rgba(20,18,15,.45); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
.sheet{ background:var(--paper); width:100%; max-width:560px; padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px)); border-top:var(--bar-bd); max-height:88vh; overflow:auto; border-radius:var(--rt) var(--rt) 0 0; }
@media (min-width:760px){ .scrim{ align-items:center; } .sheet{ border:3px solid var(--ink); padding-bottom:22px; } }
.sheet h2{ font:var(--disp-w) 22px/1.1 var(--f-disp); letter-spacing:var(--disp-ls); margin:0 0 8px; }
.sheet p{ margin:0 0 14px; color:var(--ink2); }
.sheet .stack{ display:grid; gap:10px; }
.sheet .stack .btn{ justify-content:flex-start; }
.addopts .btn{ height:auto; min-height:58px; padding:10px 14px; text-align:left; }
.addopts .btn svg{ width:22px; height:22px; flex:none; color:var(--rot); }
.addopts .btn span{ display:flex; flex-direction:column; gap:1px; }
.addopts .btn small{ font-weight:400; font-size:13px; color:var(--ink2); }
.addopts .btn.ghost{ min-height:46px; }
.toast{ position:fixed; left:50%; bottom:calc(92px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:11px 16px; font-weight:600; font-size:14.5px; z-index:60; max-width:calc(100% - 36px); }
@media (prefers-reduced-motion:no-preference){ .toast{ animation:t .18s ease-out; } @keyframes t{ from{ opacity:0; transform:translate(-50%,8px); } } }

@media print{
  .bar,.fab,.controls,.actions,.toast,.scrim{ display:none !important; }
  body{ background:#fff; color:#000; }
  .hero .cov{ max-height:7cm; aspect-ratio:auto; }
  details.intro .txt{ display:block; }
  .cols{ display:block !important; }
  .inglist{ columns:2; column-gap:1cm; }
  .ctl, .viewer{ display:none !important; }
  .part{ break-inside:auto; }
  .sechead{ break-after:avoid; }
  .sechead small{ display:none; }
  .cols .ingbox{ position:static; max-height:none; }
  .step,.ing{ break-inside:avoid; }
}

<script>
/* ===== Einheiten ===== */
const UNIT_DEF = {
  mg:{t:'m',f:0.001,s:'mg'}, g:{t:'m',f:1,s:'g'}, kg:{t:'m',f:1000,s:'kg'},
  oz:{t:'m',f:28.35,s:'oz'}, lb:{t:'m',f:453.6,s:'lb'},
  ml:{t:'v',f:1,s:'ml'}, cl:{t:'v',f:10,s:'cl'}, dl:{t:'v',f:100,s:'dl'}, l:{t:'v',f:1000,s:'l'},
  tl:{t:'v',f:5,s:'TL',frac:1}, el:{t:'v',f:15,s:'EL',frac:1}, cup:{t:'v',f:236.6,s:'cup',p:'cups',frac:1}, floz:{t:'v',f:29.57,s:'fl oz'},
  msp:{s:'Msp.',frac:1}, prise:{s:'Prise',p:'Prisen',frac:1}, stk:{s:'Stück',frac:1}, dose:{s:'Dose',p:'Dosen',frac:1},
  glas:{s:'Glas',p:'Gläser',frac:1}, becher:{s:'Becher',frac:1}, bund:{s:'Bund',frac:1}, zehe:{s:'Zehe',p:'Zehen',frac:1},
  pck:{s:'Pck.',frac:1}, handvoll:{s:'Handvoll',frac:1}, stange:{s:'Stange',p:'Stangen',frac:1}, kopf:{s:'Kopf',p:'Köpfe',frac:1},
  scheibe:{s:'Scheibe',p:'Scheiben',frac:1}, zweig:{s:'Zweig',p:'Zweige',frac:1}, knolle:{s:'Knolle',p:'Knollen',frac:1},
  blatt:{s:'Blatt',p:'Blätter',frac:1}, bl:{t:'v',f:5,s:'Barlöffel',frac:1}, spritzer:{s:'Spritzer',frac:1}, tasse:{s:'Tasse',p:'Tassen',frac:1}, schuss:{s:'Schuss',frac:1}
};
const UNIT_ALIAS = {
  mg:'mg', g:'g', gr:'g', grm:'g', gramm:'g', gram:'g', grams:'g', kg:'kg', kilo:'kg', kilogramm:'kg',
  oz:'oz', ounce:'oz', ounces:'oz', lb:'lb', lbs:'lb', pound:'lb', pounds:'lb',
  ml:'ml', milliliter:'ml', millilitre:'ml', cl:'cl', dl:'dl', l:'l', ltr:'l', liter:'l', litre:'l', litres:'l', liters:'l',
  tl:'tl', teel:'tl', 'teelöffel':'tl', tsp:'tl', teaspoon:'tl', teaspoons:'tl',
  el:'el', essl:'el', 'esslöffel':'el', tbsp:'el', tablespoon:'el', tablespoons:'el', tbs:'el',
  cup:'cup', cups:'cup', 'fl-oz':'floz', floz:'floz',
  msp:'msp', messerspitze:'msp', messerspitzen:'msp', prise:'prise', prisen:'prise', pinch:'prise', pinches:'prise',
  'stück':'stk', stk:'stk', st:'stk', stck:'stk', piece:'stk', pieces:'stk',
  dose:'dose', dosen:'dose', can:'dose', cans:'dose', tin:'dose', tins:'dose',
  glas:'glas', 'gläser':'glas', jar:'glas', jars:'glas', becher:'becher', bund:'bund', bunch:'bund', bunches:'bund',
  zehe:'zehe', zehen:'zehe', clove:'zehe', cloves:'zehe', pck:'pck', 'päckchen':'pck', packung:'pck', pkg:'pck', pk:'pck', tüte:'pck',
  handvoll:'handvoll', handful:'handvoll', stange:'stange', stangen:'stange', stalk:'stange', stalks:'stange',
  kopf:'kopf', 'köpfe':'kopf', head:'kopf', scheibe:'scheibe', scheiben:'scheibe', slice:'scheibe', slices:'scheibe',
  zweig:'zweig', zweige:'zweig', sprig:'zweig', sprigs:'zweig', knolle:'knolle', knollen:'knolle',
  blatt:'blatt', 'blätter':'blatt', tasse:'tasse', tassen:'tasse', 'barlöffel':'bl', barspoon:'bl', barspoons:'bl', spritzer:'spritzer', dashes:'spritzer', splash:'spritzer', schuss:'schuss', dash:'spritzer'
};
const MASS_CYCLE = ['g','kg','oz','lb'];
const VOL_CYCLE = ['ml','l','tl','el','cup','floz'];
const FRAC = {'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125,'⅕':.2,'⅖':.4};
const QTY = String.raw`(?:\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?\s*[½¼¾⅓⅔⅛]?|[½¼¾⅓⅔⅛])`;

function num(s){
  if(s==null) return null; s=String(s).trim();
  let m;
  if((m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[1] + m[2]/m[3];
  if((m=s.match(/^(\d+)\/(\d+)$/))) return m[1]/m[2];
  if((m=s.match(/^(\d+(?:[.,]\d+)?)\s*([½¼¾⅓⅔⅛]?)$/))) return parseFloat(m[1].replace(',','.')) + (m[2]?FRAC[m[2]]:0);
  if(FRAC[s]!=null) return FRAC[s];
  return null;
}

const LIQUID_RE=/\b(gin|vodka|wodka|rum|whisk(e)?y|bourbon|tequila|mezcal|brandy|cognac|vermouth|wermut|lik(ö|oe)r|liqueur|campari|aperol|bitters?|tonic|soda|juice|saft|sirup|syrup|wasser|water|milch|milk|sahne|cream|wein|wine|sherry|port|espresso|kaffee|coffee|tee|tea|brühe|broth|stock|öl|oil|essig|vinegar|prosecco|champagne|sekt|bier|beer)\b/i;
/* Eine Zutatenzeile → {q,q2,u,uRaw,name,approx} */
const ING_RE = new RegExp(String.raw`^\s*(?:[-–•*·]\s*)?((?:ca\.?|circa|etwa|approx\.?|about|ungefähr|gut)\s+)?(${QTY})(?:\s*(?:-|–|—|bis|to|or|oder)\s*(${QTY}))?(?:\s*(?!x\s)([A-Za-zÄÖÜäöüß\-]+)\.?)?(?=\s|$|,|\))(.*)$`,'i');
function parseIng(line){
  const raw = line.trim();
  const out = {raw, q:null, q2:null, u:null, uRaw:null, name:raw, approx:false};
  const m = raw.match(ING_RE);
  if(!m) { out.name = raw.replace(/^[-–•*·]\s*/,''); return out; }
  const after = (m[4]||'') + (m[5]||'');
  if(/^\s*x\s/i.test(after) || /^\s*[x×]\s*\d/.test(after)) return out; // "2 x 2 cm Stück"
  out.approx = !!m[1];
  out.q = num(m[2]); out.q2 = m[3]!=null ? num(m[3]) : null;
  let unitWord = m[4], rest = m[5]||'';
  if(unitWord){
    const key = unitWord.toLowerCase().replace(/\.$/,'');
    if((key==='fl') && /^\s*\.?\s*oz\.?(?=\s|$)/i.test(rest)){ out.u='floz'; out.uRaw='fl oz'; rest=rest.replace(/^\s*\.?\s*oz\.?/i,''); }
    else if(UNIT_ALIAS[key]){ out.u = UNIT_ALIAS[key]; out.uRaw = unitWord; }
    else { rest = unitWord + rest; }
  }
  out.name = rest.replace(/^\s*[.,]?\s*/,'').trim();
  if(out.u==='oz' && LIQUID_RE.test(out.name)){ out.u='floz'; out.uRaw='fl oz'; }
  return out;
}

/* ===== Mengen formatieren & umrechnen ===== */
const FRAC_OUT = [[0,''],[.125,'⅛'],[.25,'¼'],[1/3,'⅓'],[.5,'½'],[2/3,'⅔'],[.75,'¾'],[1,'']];
function fmtFrac(x){
  if(x>=10) return String(Math.round(x));
  let w = Math.floor(x), r = x-w, best=FRAC_OUT[0], d=9;
  for(const f of FRAC_OUT){ const dd=Math.abs(r-f[0]); if(dd<d){d=dd;best=f;} }
  if(best[0]===1){ w+=1; best=[0,'']; }
  if(d>0.06) return fmtDec(x,1);
  if(w===0 && !best[1]) return fmtDec(x,2);
  return (w?String(w):'') + best[1];
}
function fmtDec(x,dp){ const v = Math.round(x*10**dp)/10**dp; return String(v).replace('.',','); }
function roundMetric(x){
  if(x<1) return fmtDec(x,2);
  if(x<10) return fmtDec(Math.round(x*2)/2,1);
  if(x<100) return String(Math.round(x));
  if(x<1000) return String(Math.round(x/5)*5);
  return String(Math.round(x/10)*10);
}
function convertQ(q,from,to){ return q*UNIT_DEF[from].f/UNIT_DEF[to].f; }
function pickUnit(q,u,mode){
  const d=UNIT_DEF[u]; if(!d||!d.t) return u;
  if(mode==='metric'){
    if(d.t==='m'){ const g=q*d.f; return g>=1000?'kg':'g'; }
    if(u==='tl'||u==='el') return u;
    const ml=q*d.f; return ml>=1000?'l':'ml';
  }
  if(mode==='us'){
    if(d.t==='m'){ const g=q*d.f; return g>=454?'lb':'oz'; }
    if(u==='tl'||u==='el') return u;
    const ml=q*d.f; if(ml>=60) return 'cup'; if(ml>=15) return 'el'; return 'tl';
  }
  return u;
}
function fmtQty(q,u){
  const d = u?UNIT_DEF[u]:null;
  if(d && d.t && !d.frac) return (u==='kg'||u==='l'||u==='oz'||u==='lb') ? fmtDec(q, q<10?2:1).replace(/,0+$/,'') : roundMetric(q);
  return fmtFrac(q);
}
function unitLabel(u,q,uRaw,mode){
  const d = u?UNIT_DEF[u]:null; if(!d) return uRaw||'';
  if(mode==='us' && u==='el') return 'tbsp';
  if(mode==='us' && u==='tl') return 'tsp';
  return (q!=null && q>1.05 && d.p) ? d.p : d.s;
}
/* liefert {amount,unit,name,conv,raw} für die Anzeige */
function renderIng(ing, factor, mode, override){
  if(ing.q==null) return {amount:'', unit:'', name:ing.name, approx:false, conv:false};
  let q = ing.q*factor, q2 = ing.q2!=null ? ing.q2*factor : null, u = ing.u;
  let target = override || (u ? pickUnit(q,u,mode) : null);
  if(u && target && target!==u && UNIT_DEF[u].t && UNIT_DEF[target].t===UNIT_DEF[u].t){
    q = convertQ(q,u,target); if(q2!=null) q2=convertQ(q2,u,target); u=target;
  }
  let amount = fmtQty(q,u) + (q2!=null ? '–'+fmtQty(q2,u) : '');
  return {amount, unit:unitLabel(u,q2??q,ing.uRaw,mode), name:ing.name, approx:ing.approx, conv: !!(u && UNIT_DEF[u].t), u};
}
function cycleUnit(u){
  const d=UNIT_DEF[u]; if(!d||!d.t) return null;
  const c = d.t==='m'?MASS_CYCLE:VOL_CYCLE; const i=c.indexOf(u);
  return c[(i+1)%c.length];
}

/* ===== Zutatenblock (Text) → Liste ===== */
function splitOutsideParens(s, seps){
  const out=[]; let depth=0, cur='';
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(c==='('||c==='[') depth++; else if((c===')'||c===']')&&depth>0) depth--;
    if(depth===0 && seps.includes(c) && !(c===',' && /\d/.test(s[i+1]||'') && /\d/.test(s[i-1]||''))){ out.push(cur); cur=''; continue; }
    cur+=c;
  }
  out.push(cur); return out.map(x=>x.trim()).filter(Boolean);
}
const GROUP_RE = /^(?:#+\s*|für\s+(?:den|die|das)\s+|for\s+the\s+|zum\s+|zur\s+|außerdem|dazu)/i;
function parseIngredientsText(text){
  const items=[];
  for(let line of String(text||'').split('\n')){
    line=line.trim(); if(!line) continue;
    if(/^#+\s*/.test(line)){ items.push({h:line.replace(/^#+\s*/,'').replace(/:$/,'')}); continue; }
    if(/:$/.test(line) && line.length<50 && !ING_RE.test(line)){ items.push({h:line.replace(/:$/,'')}); continue; }
    items.push(parseIng(line));
  }
  return items;
}
/* zerlegt Fließtext-Zutaten ("2 Zwiebeln, 150 g Reis, Salz; für die Soße: …") in Zeilen */
function explodeIngredientLine(line){
  const parts = splitOutsideParens(line, [';']);
  const res=[];
  for(let p of parts){
    let m;
    while((m=p.match(/^((?:für|for)\s+(?:den|die|das|the)\s+[^:]{2,30}|zum\s+[^:]{2,30}):\s*(.*)$/i))){ res.push('## '+cap(m[1])); p=m[2]; }
    const segs = splitOutsideParens(p, [',']);
    const qtyStarts = segs.filter(s=>ING_RE.test(s)).length;
    if(segs.length>=3 || (segs.length>=2 && qtyStarts>=2)) res.push(...segs);
    else if(p) res.push(p);
  }
  return res;
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

/* ===== Zeiten ===== */
function parseDuration(s){
  if(s==null) return null; s=String(s).trim().toLowerCase(); if(!s) return null;
  let m;
  if((m=s.match(/^(\d+):(\d{1,2})$/))) return (+m[1])*60 + (+m[2]);
  if(/^\d+([.,]\d+)?$/.test(s)) return Math.round(parseFloat(s.replace(',','.')));
  let total=0, hit=false;
  const re=/(\d+(?:[.,]\d+)?)\s*(tage?n?|d\b|days?|std\.?|stunden?|h\b|hours?|hrs?|min\.?|minuten?|minutes?|mins?)/g;
  while((m=re.exec(s))){ hit=true; const v=parseFloat(m[1].replace(',','.')); const u=m[2];
    if(/^(t|d)/.test(u)) total+=v*1440; else if(/^(s|h)/.test(u)) total+=v*60; else total+=v; }
  if(/über nacht|overnight/.test(s)){ hit=true; total+=Math.max(0,720-total); }
  return hit?Math.round(total):null;
}
function fmtDuration(min){
  if(min==null||isNaN(min)) return '';
  if(min<60) return min+' Min.';
  if(min>=2880 && min%1440===0) return (min/1440)+' Tage';
  const h=Math.floor(min/60), r=min%60;
  return h+' Std.'+(r?' '+r+' Min.':'');
}

/* ===== Freitext-Import ===== */
const H_ING = /^(zutaten|ingredients?|einkaufsliste|du brauchst|you(?:'|’)?ll need|what you need)\s*(:|$|für\s+(ca\.\s*)?\d|for\s+\d|\(|-)/i;
const H_STEP = /^(zubereitung|method|instructions?|directions?|preparation|anleitung|so geht(?:'|’)?s|und so geht(?:'|’)?s|schritte|steps)\s*(:|$)/i;
const H_SUBSTEP = /^(anrichten|servieren|fertigstellen|garnieren|to serve|assembly|finish)\s*:?$/i;
const SERV_RE = /(?:zutaten\s+)?(?:für|for|serves|ergibt|makes|portionen:?)\s*(?:ca\.\s*)?(\d+)(?:\s*[-–]\s*(\d+))?\s*([A-Za-zÄÖÜäöüß]+)?/i;
const ABBR = /(?:\b(?:z|u|v|d|s|o|ca|bzw|evtl|ggf|inkl|gem|std|min|max|esp|etc|vgl|nr|bspw|zb|e|ca|i|approx|tbsp|tsp|el|tl|msp|pck)\.)$/i;

function splitSentences(p){
  const out=[]; let cur='';
  const toks = p.split(/(?<=[.!?])\s+/);
  for(const t of toks){
    cur = cur ? cur+' '+t : t;
    const next = toks[toks.indexOf(t)+1];
    if(ABBR.test(cur) || /\b[A-ZÄÖÜa-z]\.$/.test(cur)) continue;
    out.push(cur); cur='';
  }
  if(cur) out.push(cur);
  return out;
}
function chunkSteps(paras){
  const steps=[];
  for(const p of paras){
    for(const s of splitSentences(p)){ const t=s.trim(); if(t) steps.push(t); }
    continue;
    if(p.length<=320){ steps.push(p); continue; }
    let cur='';
    for(const s of splitSentences(p)){
      if(cur && (cur.length+s.length>240)){ steps.push(cur); cur=s; }
      else cur = cur?cur+' '+s:s;
    }
    if(cur) steps.push(cur);
  }
  return steps;
}
function joinWrapped(lines){
  // Silbentrennung & Zeilenumbrüche von Live Text zusammenführen
  const out=[];
  for(let l of lines){

/* ===================== Speicher (IndexedDB, nur auf diesem Gerät) ===================== */
let recipes = [];
let loaded = false;
const DB_NAME='rezeptkasten', STORE='recipes';
let dbp=null;
function getDB(){ return dbp || (dbp = new Promise((res,rej)=>{ const r=indexedDB.open(DB_NAME,1); r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); })); }
async function idbAll(){ const db=await getDB(); return new Promise((res,rej)=>{ const q=db.transaction(STORE).objectStore(STORE).getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>rej(q.error); }); }
async function idbTx(fn){ const db=await getDB(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readwrite'); fn(tx.objectStore(STORE)); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }); }
const pref = (()=>{ try{ return JSON.parse(localStorage.getItem(LS_PREF)||'{}'); }catch(e){ return {}; } })();
function savePref(){ try{ localStorage.setItem(LS_PREF, JSON.stringify(pref)); }catch(e){} }
let persisted = null;
async function initStore(){
  try{
    recipes = await idbAll();
    for(const r of recipes){ if(migrateRecipe(r)) await idbTx(s=>s.put(r)); }
    // Altbestand aus localStorage übernehmen
    try{ const old=JSON.parse(localStorage.getItem(LS_KEY)||'null'); if(Array.isArray(old) && old.length){ for(const r of old){ delete r._local; if(!recipes.some(x=>x.id===r.id)){ recipes.push(r); await idbTx(s=>s.put(r)); } } localStorage.removeItem(LS_KEY); } }catch(e){}
  }catch(e){ toast('Speicher nicht verfügbar – privater Modus?'); }
  loaded = true;
  try{ if(navigator.storage && navigator.storage.persist) persisted = await navigator.storage.persist(); }catch(e){}
  onDataChanged();
}
async function persist(r){
  r.updatedAt = Date.now(); delete r._local;
  const i = recipes.findIndex(x=>x.id===r.id);
  if(i>=0) recipes[i]=r; else recipes.unshift(r);
  try{ await idbTx(s=>s.put(r)); }catch(e){ toast('Konnte nicht speichern: Gerätespeicher voll?'); }
}
async function removeRecipe(id){
  recipes = recipes.filter(r=>r.id!==id);
  try{ await idbTx(s=>s.delete(id)); }catch(e){}
}

/* ===================== Zeiten & Filter ===================== */
function activeMin(r){ return (r.prep==null && r.cook==null) ? null : (r.prep||0)+(r.cook||0); }
function totalMin(r){ if(r.total!=null) return r.total; const a=activeMin(r); return (a==null && r.rest==null) ? null : (a||0)+(r.rest||0); }
const TIME_BUCKETS = [['all','Alle'],['30','bis 30 Min.'],['60','bis 1 Std.'],['120','bis 2 Std.'],['long','länger']];
const filt = { q:'', courses:new Set(), tags:new Set(), people:new Set(), time:'all', timeBase:'active', fav:false, sort: pref.sort||'new' };
function filtered(){
  const q = filt.q.trim().toLowerCase();
  let list = recipes.filter(r=>{
    if(filt.fav && !r.fav) return false;
    if(filt.people.size && !filt.people.has(personKey(r))) return false;
    if(filt.courses.size && !(r.courses||[]).some(c=>filt.courses.has(c))) return false;
    if(filt.tags.size && ![...filt.tags].every(t=>(r.tags||[]).includes(t))) return false;
    if(filt.time!=='all'){
      const m = filt.timeBase==='active' ? activeMin(r) : totalMin(r);
      if(m==null) return false;
      if(filt.time==='long'){ if(m<=120) return false; } else if(m>+filt.time) return false;
    }
    if(q){
      const hay = [r.title,r.by,r.via,(r.tags||[]).join(' '),(r.courses||[]).join(' '),getGroups(r).ing.map(g=>g.t+' '+g.text).join(' '),r.source&&r.source.name,r.source&&r.source.author].join(' ').toLowerCase();
      if(!q.split(/\s+/).every(w=>hay.includes(w))) return false;
    }
    return true;
  });
  const coll = new Intl.Collator('de');
  if(filt.sort==='az') list.sort((a,b)=>coll.compare(a.title||'',b.title||''));
  else if(filt.sort==='fast') list.sort((a,b)=>(activeMin(a)??1e9)-(activeMin(b)??1e9));
  else list.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  return list;
}

function personKey(r){ return (r.via||r.by||'').trim() || '–'; }

function stepServings(dir){
  const r=getR(route.id); if(!r) return;
  const base=r.servings||1;
  const step = r.servings ? (base>=8 && base%2===0 ? 2 : 1) : 0.5;
  ds.shown = Math.max(step, Math.round((ds.shown + dir*step)*100)/100);
  if(!r.servings && ds.shown<0.5) ds.shown=0.5;
  renderDetail(true);
}

/* Foto */
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
async function shrinkDataURL(src, max){
  const img = await loadImg(src);
  let w=img.naturalWidth, h=img.naturalHeight, s=Math.min(1, max/Math.max(w,h));
  for(let q=.78, m=max; ; q-=.08, m=Math.round(m*.85)){
    s=Math.min(1, m/Math.max(w,h));
    const c=document.createElement('canvas'); c.width=Math.round(w*s); c.height=Math.round(h*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const out=c.toDataURL('image/jpeg', Math.max(.5,q));
    if(out.length<160000 || m<300) return out;
  }
}
async function onPhotoPicked(file){
  if(!file) return;
  const url=URL.createObjectURL(file);
  try{ collectForm(); draft.photo = await shrinkDataURL(url, 1100); const paste=$('#pasteText')?$('#pasteText').value:null; renderEditor(true); if(paste!=null) $('#pasteText').value=paste; }
  catch(e){ toast('Bild nicht lesbar'); }
  finally{ URL.revokeObjectURL(url); }
}

function plainIngLines(text){
  return parseIngredientsText(text).map(it=>{
    if(it.h) return {h:it.h};
    const d=renderIng(it,1,'orig');
    return {a: d.amount ? ((d.approx?'ca. ':'')+d.amount+(d.unit?' '+d.unit:'')) : '', n:d.name};
  });
}
function exportText(r){
  const L=[];
  L.push(r.title.toUpperCase()); if(personLine(r)) L.push(personLine(r)); L.push('');
  const meta=[];
  if(r.servings) meta.push(`Für ${fmtFrac(r.servings)} ${r.servingsUnit||'Portionen'}`);
  if(r.prep!=null) meta.push('Vorbereitung '+fmtDuration(r.prep));
  if(r.cook!=null) meta.push('Kochen/Backen '+fmtDuration(r.cook));
  if(r.rest!=null) meta.push('Warten '+fmtDuration(r.rest));
  if(r.difficulty) meta.push('Schwierigkeit: '+r.difficulty);
  if(r.shelfLife) meta.push('Haltbarkeit: '+r.shelfLife);
  if(meta.length) L.push(meta.join(' | '),'');
  const G=getGroups(r), mi=G.ing.length>1||G.ing.some(g=>g.t), ms=G.steps.length>1||G.steps.some(g=>g.t);
  L.push('ZUTATEN');
  G.ing.forEach(g=>{ if(mi) L.push('',(g.t||'')+':'); plainIngLines(g.text).forEach(x=> L.push(x.h ? '\n'+x.h+':' : '– '+(x.a?x.a+' ':'')+x.n)); });
  L.push('','ZUBEREITUNG');

}

async function loadFontCSS(){
  try{
    const css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
    const rules=css.match(/@font-face\{[^}]*\}/g)||[]; const out=[];
    for(let r of rules){
      const m=r.match(/url\(([^)]+)\)/); if(!m) continue;
      if(!/^data:/.test(m[1])){
        const res=await fetch(m[1]); if(!res.ok) continue;
        const blob=await res.blob();
        const du=await new Promise(ok=>{ const fr=new FileReader(); fr.onload=()=>ok(fr.result); fr.readAsDataURL(blob); });
        r=r.replace(m[1], du.replace(/^data:[^;]*;/,'data:font/woff2;'));
      }
      out.push(r);
    }
    FONT_RULES=out; FONT_CSS='';
  }catch(e){ FONT_CSS=''; }
}

  }catch(e){ if(e && e.name==='AbortError') return true; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);

/* ===================== Import & Backup ===================== */
async function importFile(file){
  if(!file) return;
  const text = await file.text();
  let items=[], from='', kind='';
  try{
    if(/^\s*[\[{]/.test(text)){
      const j=JSON.parse(text);
      if(Array.isArray(j)) items=j; else { items = j.recipes || (j.recipe?[j.recipe]:[j]); from=j.from||''; kind=j.kind||(j.recipes?'backup':'recipe'); }
    } else {
      const m = text.match(/<script[^>]*id="rezeptkasten-data"[^>]*>([\s\S]*?)<\/script>/i);
      if(m){ const j=JSON.parse(m[1]); items = j.recipes || [j.recipe]; from=j.from||''; kind=j.kind||'recipe'; }
      else {
        const doc = new DOMParser().parseFromString(text,'text/html');
        const p = parseRecipeText(doc.body ? doc.body.innerText || doc.body.textContent : text);
        items=[{...blankRecipe(), ...p, title:p.title||file.name.replace(/\.\w+$/,'')}]; kind='text';
      }
    }
  }catch(e){ toast('Datei nicht lesbar'); return; }
  items = items.filter(it=>it && typeof it==='object' && it.title);
  if(!items.length){ toast('Keine Rezepte gefunden'); return; }
  let foreign = from && from!==myName();
  const dupes = items.filter(it=>getR(it.id)).length;
  const fresh = items.length - dupes;
  const doImport = async(updateDupes, asOwn)=>{
    if(asOwn){ pref.name=from; savePref(); foreign=false; }
    let added=0, updated=0, lastId=null;
    for(const it of items){
      const r = {...blankRecipe(), ...it}; delete r._local; delete r.cookEstimated; delete r.cookEstimate;
      migrateRecipe(r);
      if(foreign){
        if(!it.by) r.by = from;
        if(r.by!==from) r.via = from; else r.via = it.via||'';
        r.importedAt = Date.now(); r.fav=false;
      } else if(kind==='text'){ r.by = myName(); }
      const ex = getR(r.id);
      if(ex){
        if(updateDupes && (r.updatedAt||0) > (ex.updatedAt||0)){ r.fav=ex.fav; await persist(r); updated++; lastId=r.id; }
        continue;
      }
      if(!r.createdAt) r.createdAt=Date.now();
      await persist(r); added++; lastId=r.id;
    }
    const msg=[added?`${added} neu`:'', updated?`${updated} aktualisiert`:''].filter(Boolean).join(', ');
    toast(msg ? msg+(foreign?` – von ${from}`:'') : 'Nichts Neues dabei');
    if(items.length===1 && lastId) go({v:'detail', id:lastId}); else go({v:'list'});
  };
  const maybeMine = foreign && !myName();
  if(items.length===1 && !dupes && !maybeMine){ doImport(false); return; }
  sheet(`<h2>${foreign?`Sammlung von ${esc(from)}`:kind==='backup'?'Backup einspielen':'Rezepte importieren'}</h2>
    <p>${items.length} ${items.length===1?'Rezept':'Rezepte'} in der Datei${dupes?`, davon ${dupes} schon in deiner Sammlung`:''}.${foreign?` Sie werden mit „geteilt von ${esc(from)}“ markiert und lassen sich danach filtern.`:''}</p>
    <div class="stack">
      ${fresh?`<button class="btn primary" id="impNew">${fresh} neue übernehmen</button>`:''}
      ${dupes?`<button class="btn" id="impUpd">Neue übernehmen, vorhandene durch neuere Fassung ersetzen</button>`:''}
      ${maybeMine?`<button class="btn" id="impMine">Das bin ich: als mein eigenes Backup übernehmen</button>`:''}
      <button class="btn ghost" data-act="closesheet">Abbrechen</button></div>`);
  if($('#impMine')) $('#impMine').onclick=()=>{ closeSheet(); doImport(true, true); };
  if($('#impNew')) $('#impNew').onclick=()=>{ closeSheet(); doImport(false); };
  if($('#impUpd')) $('#impUpd').onclick=()=>{ closeSheet(); doImport(true); };
}
function backup(){
  const data = JSON.stringify({format:'rezeptkasten', version:2, kind:'backup', name:myName(), exported:new Date().toISOString(), recipes:recipes.map(r=>{ const c={...r}; delete c._local; return c; })}, null, 1);
  const d=new Date(); saveFile(`rezeptkasten-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`, data, 'application/json');
}

/* ===================== Texterkennung (lokal, PaddleOCR) ===================== */
let OCR=null, ocrLoading=null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('script')); document.head.appendChild(s); }); }
function ocrProgress(msg, p){ const st=$('#ocrState'); if(!st) return; st.classList.remove('hidden'); $('#ocrMsg').textContent=msg; const b=$('#ocrBar'); b.classList.toggle('busy', p==null); b.style.width = p==null ? '100%' : Math.round(p*100)+'%'; }
const paint = () => new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
const ocrBase = () => new URL('ocr/', location.href).href;
async function fetchOk(u){ const r=await fetch(u); if(!r.ok) throw new Error(u); return r; }
/* große Dateien liegen in Teilen (GitHub-Upload-Grenze) und werden hier zusammengesetzt */
async function fetchParts(u, n){
  const bufs=[]; for(let i=1;i<=n;i++) bufs.push(new Uint8Array(await (await fetchOk(u+'.'+i)).arrayBuffer()));
  const out=new Uint8Array(bufs.reduce((s,b)=>s+b.length,0)); let o=0; for(const b of bufs){ out.set(b,o); o+=b.length; } return out;
}
async function getOCR(){
  if(OCR) return OCR;
  if(!ocrLoading) ocrLoading = (async()=>{
    const B=ocrBase();
    ocrProgress('Lade Texterkennung …', .05);
    if(!window.ort) await loadScript('ocr/ort.wasm.min.js');
    ort.env.wasm.wasmPaths = B; ort.env.wasm.numThreads = 1;
    ort.env.wasm.wasmBinary = (await fetchParts(B+'ort-wasm-simd-threaded.wasm', 2)).buffer;
    const opt={executionProviders:['wasm'], graphOptimizationLevel:'all'};
    const det = await ort.InferenceSession.create(await fetchParts(B+'det.onnx', 2), opt);
    ocrProgress('Lade Texterkennung …', .45);
    const rec = await ort.InferenceSession.create(await fetchParts(B+'rec.onnx', 3), opt);
    ocrProgress('Lade Wörterbuch …', .8); await paint();
    let dict=(await (await fetchOk(B+'rec_dict.txt')).text()).replace(/\r/g,'').split('\n'); if(dict[dict.length-1]==='') dict.pop();
    const words=(await (await fetchOk(B+'woerter.txt')).text()).split('\n');
    ocrProgress('Bereite Wörterbuch vor …', .92); await paint();
    const rank=new Map(); words.forEach((w,i)=>{ if(w) rank.set(w,i); });
    OCR={det, rec, chars:['', ...dict, ' '], rank, N:words.length};
    try{ localStorage.setItem('ocrReady','1'); }catch(e){}
    ocrProgress('Texterkennung bereit', 1);
    return OCR;
  })();

  const show=()=>{ img.src=list[i]; img.style.width=(z*100)+'%'; };
  v.addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.close) v.remove();
    if(b.dataset.z==='+'){ z=Math.min(5,z*1.5); show(); }
    if(b.dataset.z==='-'){ z=Math.max(1,z/1.5); show(); }
    if(b.dataset.n){ i=(i+1)%list.length; z=1; show(); sc.scrollTo(0,0); } });
  let lastTap=0; img.addEventListener('click', e=>{ const now=Date.now(); if(now-lastTap<350){ const rect=img.getBoundingClientRect(); const fx=(e.clientX-rect.left)/rect.width, fy=(e.clientY-rect.top)/rect.height; z = z>1?1:2.5; show(); requestAnimationFrame(()=>{ sc.scrollLeft=fx*img.offsetWidth-sc.clientWidth/2; sc.scrollTop=fy*img.offsetHeight-sc.clientHeight/2; }); } lastTap=now; });
  show();
}
async function compressScan(img){
  const M=1800, s=Math.min(1, M/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c.toDataURL('image/jpeg',0.72);
}

/* ===================== Sheets, Toast ===================== */
function sheet(html, modal){
  closeSheet();
  const s=document.createElement('div'); s.className='scrim'; s.id='scrim';
  s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  if(!modal) s.addEventListener('click', e=>{ if(e.target===s) closeSheet(); });
  document.body.appendChild(s);
  const f=s.querySelector('button'); if(f) f.focus();
}
function closeSheet(){ const s=$('#scrim'); if(s) s.remove(); }
let confirmCb=null;
function confirmSheet(title, text, label, cb){ confirmCb=cb; sheet(`<h2>${esc(title)}</h2><p>${esc(text)}</p><div class="stack"><button class="btn red" data-act="confirmyes">${esc(label)}</button><button class="btn" data-act="closesheet">Abbrechen</button></div>`); }
let toastT;
function toast(msg){ let t=$('#toast'); if(t) t.remove(); t=document.createElement('div'); t.id='toast'; t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; document.body.appendChild(t); clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2600); }
const SAMPLE = `Gebackene Möhren mit Tahin und Dukkah
Ein unkompliziertes Ofengericht für den Herbst. Das Dukkah lässt sich gut vorbereiten und hält sich in einem verschlossenen Glas 2 Wochen.
Zutaten für 4 Personen: 800 g bunte Möhren, 3 EL Olivenöl, 1 TL Kreuzkümmel, Salz; für die Soße: 80 g Tahin, Saft von 1 Zitrone, 1 Knoblauchzehe, 4–5 EL kaltes Wasser; zum Servieren: 2 EL Dukkah, ½ Bund Petersilie
Zubereitung:
Den Ofen auf 220 Grad (Umluft 200 Grad) vorheizen. Möhren schälen, längs halbieren und mit Öl, Kreuzkümmel und Salz mischen.
Auf einem Blech verteilen und etwa 30 Minuten backen, bis sie an den Rändern dunkel werden.
Inzwischen Tahin mit Zitronensaft, gepresstem Knoblauch und Wasser glatt rühren, bis eine dickflüssige Soße entsteht.
Anrichten
Soße auf eine Platte streichen, Möhren darauflegen, mit Dukkah und Petersilie bestreuen.`;

/* ===================== Ereignisse ===================== */
document.addEventListener('click', async e=>{
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, v=el.dataset.v;
  switch(act){
    case 'new': addSheet(); break;
    case 'addphoto': closeSheet(); if(window.__TEST){ draft=null; go({v:'edit', id:null}); ocrProgress('Die Texterkennung funktioniert in dieser Vorschau nicht.', 0); break; }
      try{ if(!localStorage.getItem('ocrReady')){ ocrIntro(); break; } }catch(e){}
      draft=null; go({v:'edit', id:null}); getOCR().catch(()=>{}); $('#fileOcr').click(); break;
    case 'ocrgo': closeSheet(); if(route.v!=='edit'){ draft=null; go({v:'edit', id:null}); } getOCR().catch(()=>{}); $('#fileOcr').click(); break;
    case 'addtext': {
      closeSheet(); draft=null; go({v:'edit', id:null});
      let clip=null; try{ if(navigator.clipboard && navigator.clipboard.readText) clip = navigator.clipboard.readText(); }catch(err){}
      if(clip){ clip.then(t=>{ const ta=$('#pasteText'); if(ta && t && t.trim().length>20){ ta.value=t; fillFromParse(parseRecipeText(t)); $('#parseMsg').textContent='Aus der Zwischenablage übernommen. '+$('#parseMsg').textContent; } else if(ta) ta.focus(); }).catch(()=>{ const ta=$('#pasteText'); if(ta) ta.focus(); }); }
      else setTimeout(()=>{ const t=$('#pasteText'); if(t) t.focus(); },50);
      break; }
    case 'addblank': closeSheet(); draft=null; go({v:'edit', id:null}); setTimeout(()=>{ const b=$('.importbox'); if(b) b.remove(); $('#f_title').focus(); },30); break;
    case 'open': go({v:'detail', id:el.dataset.id}); break;
    case 'back': go({v:'list'}); break;
    case 'fcourse': filt.courses.has(v)?filt.courses.delete(v):filt.courses.add(v); renderFilters(); renderResults(); break;
    case 'ftag': filt.tags.has(v)?filt.tags.delete(v):filt.tags.add(v); renderFilters(); renderResults(); break;
    case 'ftime': filt.time=v; renderFilters(); renderResults(); break;
    case 'fbase': filt.timeBase=v; renderFilters(); renderResults(); break;
    case 'fperson': filt.people.has(v)?filt.people.delete(v):filt.people.add(v); renderFilters(); renderResults(); break;
    case 'ffav': filt.fav=!filt.fav; renderFilters(); renderResults(); break;
    case 'clearfilters': filt.courses.clear(); filt.tags.clear(); filt.people.clear(); filt.time='all'; filt.fav=false; filt.q=''; renderList(); break;
    case 'importfile': closeSheet(); $('#fileImport').click(); break;
    case 'setname': closeSheet(); askName(); break;
    case 'look': lookSheet(); break;
    case 'setstyle': pref.style=v; savePref(); applyLook(); lookSheet(); render(); break;
    case 'setsym': pref.symbols=v; savePref(); lookSheet(); render(); break;
    case 'sharelib': closeSheet(); withName(libSheet); break;
    case 'libshare': { const ph=$('#libPhotos')?$('#libPhotos').checked:true; closeSheet(); shareLibrary(v, ph); break; }
    case 'closesheet': closeSheet(); break;
    case 'confirmyes': closeSheet(); if(confirmCb){ const cb=confirmCb; confirmCb=null; cb(); } break;
    /* Detail */
    case 'check': { if(e.target.closest('.qty.conv')) break; const i=+el.dataset.i; ds.checked.has(i)?ds.checked.delete(i):ds.checked.add(i); el.classList.toggle('done'); break; }
    case 'unit': { e.stopPropagation(); const i=+el.dataset.i; const nx=cycleUnit(el.dataset.u); if(nx){ ds.over[i]=nx; renderDetail(true); } break; }
    case 'stepdone': { const i=+el.dataset.i; ds.done.has(i)?ds.done.delete(i):ds.done.add(i); el.classList.toggle('done'); break; }
    case 'less': stepServings(-1); break;
    case 'more': stepServings(1); break;
    case 'mode': ds.mode=v; ds.over={}; pref.unitMode=v; savePref(); renderDetail(true); break;
    case 'wake': toggleWake(); break;
    case 'fav': { const r=getR(route.id); if(r){ r.fav=!r.fav; await persist(r); renderDetail(true); } break; }
    case 'edit': draft=null; go({v:'edit', id:route.id}); break;
    case 'share': { const r=getR(route.id); if(r) withName(()=>saveFile(slug(r.title)+'.html', exportHTML(getR(r.id)), 'text/html')); break; }
    case 'copytext': { const r=getR(route.id); if(r) copyText(exportText(r)); break; }
    case 'print': {
      const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
      const r=getR(route.id);
      if(standalone && /iPhone|iPad|iPod/.test(navigator.userAgent) && r){ toast('Im Teilen-Menü „Drucken“ wählen'); saveFile(slug(r.title)+'.html', exportHTML(r), 'text/html'); break; }
      try{ window.print(); }catch(err){ toast('Drucken hier nicht möglich – „Teilen“ und dort drucken'); } break; }
    case 'delete': { const id=route.id; const r=getR(id); if(!r) break;
      confirmSheet('Rezept löschen?', `„${r.title}“ wird endgültig entfernt.`, 'Löschen', async()=>{ draft=null; await removeRecipe(id); go({v:'list'}); toast('Gelöscht'); }); break; }
    /* Editor */
    case 'cancel': { const id=route.id; draft=null; go(id?{v:'detail',id}:{v:'list'}); break; }
    case 'save': saveDraft(); break;
    case 'parse': { const t=$('#pasteText').value; if(!t.trim()){ $('#parseMsg').textContent='Erst Text einfügen.'; break; } fillFromParse(parseRecipeText(t)); break; }
    case 'sample': $('#pasteText').value=SAMPLE; break;
    case 'ocr': if(window.__TEST){ ocrProgress('Die Texterkennung funktioniert in dieser Vorschau nicht.', 0); break; } try{ if(!localStorage.getItem('ocrReady')){ ocrIntro(); break; } }catch(e){} getOCR().catch(()=>{}); $('#fileOcr').click(); break;
    case 'addgroup': { collectForm(); (v==='ig'?draft.ingGroups:draft.stepGroups).push({t:'',text:''}); const p=$('#pasteText')?$('#pasteText').value:null; renderEditor(true); if(p!=null) $('#pasteText').value=p; const cards=document.querySelectorAll('.gcard.'+v); const last=cards[cards.length-1]; if(last){ last.scrollIntoView({block:'center'}); const t=last.querySelector('.gh'); if(t) t.focus(); } break; }
    case 'rmgroup': { collectForm(); const [k,i]=v.split(':'); const arr=k==='ig'?draft.ingGroups:draft.stepGroups; arr.splice(+i,1); if(!arr.length) arr.push({t:'',text:''}); const p=$('#pasteText')?$('#pasteText').value:null; renderEditor(true); if(p!=null) $('#pasteText').value=p; break; }
    case 'viewscan': openViewer(draft.scans, +v); break;
    case 'rmscans': { collectForm(); draft.scans=[]; const p=$('#pasteText')?$('#pasteText').value:null; renderEditor(true); if(p!=null) $('#pasteText').value=p; break; }
    case 'usecook': { collectForm(); draft.cook=draft.cookEstimate; const p=$('#pasteText')?$('#pasteText').value:null; renderEditor(true); if(p!=null) $('#pasteText').value=p; break; }
    case 'photo': $('#filePhoto').click(); break;
    case 'nophoto': { collectForm(); draft.photo=''; const p=$('#pasteText')?$('#pasteText').value:null; renderEditor(true); if(p!=null) $('#pasteText').value=p; break; }
    case 'tcourse': { const i=draft.courses.indexOf(v); i>=0?draft.courses.splice(i,1):draft.courses.push(v); renderCourseChips(); break; }
    case 'addtag': addTag(); break;
    case 'tagadd': addTag(v); break;
    case 'rmtag': draft.tags=draft.tags.filter(t=>t!==v); renderTagChips(); break;
    case 'diff': draft.difficulty=v; document.querySelectorAll('#diffSeg button').forEach(b=>b.classList.toggle('on', b.dataset.v===v)); break;
  }
});
$('#fileImport').addEventListener('change', e=>{ const f=e.target.files[0]; e.target.value=''; importFile(f); });
$('#fileOcr').addEventListener('change', e=>{ const f=[...e.target.files]; e.target.value=''; runOCR(f); });
$('#filePhoto').addEventListener('change', e=>{ const f=e.target.files[0]; e.target.value=''; onPhotoPicked(f); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('#cropCv')) closeSheet(); });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && route.v==='detail' && $('.wake.on') && !wakeLock) toggleWake(); });

applyLook();
render();
initStore();
loadFontCSS();
if('serviceWorker' in navigator && location.protocol!=='file:'){ window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }

</script>
